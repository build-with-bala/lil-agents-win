name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LilAgents.sln

      - name: Build
        run: dotnet build LilAgents.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/LilAgents.Tests/LilAgents.Tests.csproj --configuration Release --no-build --logger "console;verbosity=detailed"

  publish:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Self-contained single file: one LilAgents.exe that runs on a machine with no
      # .NET installed. PublishTrimmed is deliberately absent — WPF resolves types by
      # reflection through the XAML stack and does not survive trimming.
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/LilAgents/LilAgents.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      - name: Report size
        shell: pwsh
        run: |
          Get-ChildItem publish/${{ matrix.rid }} |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: LilAgents-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/LilAgents.exe
          if-no-files-found: error
